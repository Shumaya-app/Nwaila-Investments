         <sc-for list=\"{{ signals }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <span style=\"border:1px solid rgba(122,182,72,0.28);border-radius:999px;padding:7px 14px;font-size:13.5px;color:rgba(240,240,235,0.75)\">{{ s }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"background:#0F150F;border:1px solid rgba(122,182,72,0.3);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(18px);transition:opacity .7s ease .07s,transform .7s ease .07s\">\n            <p style=\"margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">02 · Permissioned request<\u002Fp>\n            <svg sc-camel-view-box=\"0 0 240 90\" style=\"width:100%;height:auto;margin-bottom:16px\">\n              <path d=\"M4 45 H236\" stroke=\"rgba(240,240,235,0.12)\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n              <path d=\"M4 45 H236\" stroke=\"#7AB648\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"14 10\" style=\"animation:nwDash 6s linear infinite\"><\u002Fpath>\n              <circle cx=\"4\" cy=\"45\" r=\"6\" fill=\"#7AB648\"><\u002Fcircle>\n              <circle cx=\"236\" cy=\"45\" r=\"6\" fill=\"#7AB648\"><\u002Fcircle>\n              <rect x=\"92\" y=\"30\" width=\"56\" height=\"30\" rx=\"8\" fill=\"#0F150F\" stroke=\"rgba(122,182,72,0.5)\" stroke-width=\"1.5\"><\u002Frect>\n              <text x=\"120\" y=\"49\" text-anchor=\"middle\" fill=\"#8CC63F\" font-size=\"11\" font-family=\"JetBrains Mono, monospace\">CONSENT<\u002Ftext>\n            <\u002Fsvg>\n            <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(240,240,235,0.6)\">You request a scope. The owner approves it, sees what was shared, and can withdraw.<\u002Fp>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"background:#0F150F;border:1px solid rgba(240,240,235,0.08);border-radius:18px;padding:26px;opacity:0;transform:translateY(18px);transition:opacity .7s ease .14s,transform .7s ease .14s\">\n            <p style=\"margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">03 · What it unlocks<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ unlocks }}\" as=\"u\" hint-placeholder-count=\"4\">\n                <div>\n                  <p style=\"margin:0 0 3px;font-size:15.5px;font-weight:600\">{{ u.title }}<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:rgba(240,240,235,0.5)\">{{ u.body }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(18px,4vw,40px) clamp(80px,10vw,120px)\">\n      <div style=\"max-width:1300px;margin:0 auto;border-top:1px solid rgba(240,240,235,0.08);padding-top:clamp(36px,5vw,56px)\">\n        <p data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F;margin:0 0 16px;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease\">Double click · SME funding pathways<\u002Fp>\n        <h2 data-reveal=\"\" style=\"font-size:clamp(26px,3.6vw,40px);font-weight:600;letter-spacing:-0.03em;line-height:1.08;margin:0 0 clamp(30px,4vw,42px);max-width:680px;opacity:0;transform:translateY(16px);transition:opacity .7s ease .06s,transform .7s ease .06s\">A decline becomes a pathway.<\u002Fh2>\n\n        <div style=\"border:1px solid rgba(240,240,235,0.11);border-radius:20px;background:#0B100C;overflow:hidden\">\n          <div style=\"padding:clamp(20px,3vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n            <sc-for list=\"{{ pathway }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"position:relative;border-radius:14px;padding:20px 18px;background:#0F150F;border:1px solid {{ p.bd }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">{{ p.step }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color: {{ p.fg }}\">{{ p.state }}<\u002Fspan>\n                <\u002Fdiv>\n                <h4 style=\"font-size:17.5px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px;line-height:1.25\">{{ p.title }}<\u002Fh4>\n                <p style=\"margin:0 0 14px;font-size:14px;line-height:1.5;color:rgba(240,240,235,0.5)\">{{ p.body }}<\u002Fp>\n                <div style=\"height:4px;border-radius:2px;background:rgba(240,240,235,0.08)\"><div style=\"height:4px;border-radius:2px;background:#7AB648;width: {{ p.pct }}%;transition:width .8s ease\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(240,240,235,0.08);padding:20px clamp(20px,3vw,28px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px\">\n            <p style=\"margin:0;font-size:15px;line-height:1.5;color:rgba(240,240,235,0.6);max-width:620px\">Applicants who fail today are placed on a readiness plan inside the portal, and re-scored automatically as the gaps close. The pipeline keeps working while they get better.<\u002Fp>\n            <div style=\"display:flex;gap:26px\">\n              <div><p style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.02em;color:#8CC63F\">+31%<\u002Fp><p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">Re-entry rate<\u002Fp><\u002Fdiv>\n              <div><p style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-0.02em;color:#8CC63F\">12 wks<\u002Fp><p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">Median to ready<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13.5px;color:rgba(240,240,235,0.38)\">Figures shown are illustrative of a deployed pathway, not a Nwaila client result.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section style=\"padding:clamp(48px,6vw,84px) clamp(18px,4vw,40px) clamp(40px,5vw,60px)\">\n      <div style=\"max-width:960px;margin:0 auto\">\n        <p style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F;margin:0 0 22px\">About<\u002Fp>\n        <h1 style=\"font-size:clamp(32px,5vw,60px);font-weight:600;line-height:1.04;letter-spacing:-0.035em;margin:0 0 22px\">We build for the SME market from the inside out.<\u002Fh1>\n        <p style=\"margin:0;max-width:620px;font-size:18px;line-height:1.55;color:rgba(240,240,235,0.6)\">What we learn advising small businesses shapes what we build for the institutions serving them. It is why the strategy work survives contact with real customers.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(18px,4vw,40px) clamp(50px,6vw,80px)\">\n      <div style=\"max-width:960px;margin:0 auto;border-top:1px solid rgba(240,240,235,0.08);border-bottom:1px solid rgba(240,240,235,0.08);padding:clamp(30px,4vw,44px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(24px,4vw,40px);align-items:center\">\n        <div>\n          <p style=\"margin:0 0 10px;font-size:clamp(44px,7vw,68px);font-weight:600;line-height:1;letter-spacing:-0.04em;color:#8CC63F\">100k+<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:rgba(240,240,235,0.6)\">SMEs reached through the platforms we build for our partners.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:rgba(240,240,235,0.6)\">We reach small businesses two ways: directly, sitting inside the business, and at scale, through products institutions deploy into the market.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(18px,4vw,40px) clamp(50px,6vw,80px)\">\n      <div style=\"max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(24px,3vw,32px)\">\n        <div data-reveal=\"\" style=\"border-top:1px solid rgba(240,240,235,0.12);padding-top:18px;opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n          <h4 style=\"font-size:18px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px\">Close to the work<\u002Fh4>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(240,240,235,0.52)\">We stay in delivery long enough to see whether what we designed actually works.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"border-top:1px solid rgba(240,240,235,0.12);padding-top:18px;opacity:0;transform:translateY(16px);transition:opacity .7s ease .07s,transform .7s ease .07s\">\n          <h4 style=\"font-size:18px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px\">Plain about what we find<\u002Fh4>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(240,240,235,0.52)\">A diagnostic is only worth doing if you're told the truth at the end of it.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"border-top:1px solid rgba(240,240,235,0.12);padding-top:18px;opacity:0;transform:translateY(16px);transition:opacity .7s ease .14s,transform .7s ease .14s\">\n          <h4 style=\"font-size:18px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px\">Built to be handed over<\u002Fh4>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(240,240,235,0.52)\">The aim is that your people run it without us in the room.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(18px,4vw,40px) clamp(80px,10vw,120px)\">\n      <div style=\"max-width:960px;margin:0 auto;background:#0F150F;border:1px solid rgba(240,240,235,0.08);border-radius:20px;padding:clamp(28px,4vw,44px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n        <div>\n          <h3 style=\"font-size:22px;font-weight:600;letter-spacing:-0.02em;margin:0 0 10px\">Where to find us<\u002Fh3>\n          <p style=\"margin:0 0 5px;font-size:15.5px;color:rgba(240,240,235,0.6)\">Corner Main Rd &amp; Sloane Street, Bryanston, 2021<\u002Fp>\n          <p style=\"margin:0;font-size:15.5px\"><a href=\"mailto:info@nwaila.co.za\" style=\"display:inline-block;padding:11px 0\">info@nwaila.co.za<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n        <a href=\"mailto:info@nwaila.co.za?subject=Discovery%20call%20-%20Nwaila%20Investments&amp;body=Hello%20Nwaila%2C%0A%0AI%27d%20like%20to%20arrange%20a%20discovery%20call.%0A%0ABusiness%3A%20%0AWhat%27s%20in%20the%20way%3A%20%0A%0AThank%20you.\" style=\"background:#7AB648;border:none;padding:16px 30px;border-radius:999px;color:#080B09;font-size:16px;font-weight:600;text-decoration:none;white-space:nowrap;transition:.15s\" style-hover=\"background:#93D653\">Let's connect<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCheckIntro }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"padding:clamp(52px,7vw,100px) clamp(18px,4vw,40px) clamp(80px,10vw,130px)\">\n    <div style=\"max-width:820px;margin:0 auto\">\n      <p style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F;margin:0 0 22px\">Business health check<\u002Fp>\n      <h1 style=\"font-size:clamp(34px,5.2vw,62px);font-weight:600;line-height:1.03;letter-spacing:-0.035em;margin:0 0 20px\">How well is your business actually run?<\u002Fh1>\n      <p style=\"margin:0 0 clamp(32px,4vw,44px);max-width:520px;font-size:18px;line-height:1.55;color:rgba(240,240,235,0.6)\">Eighteen questions. Ten minutes. One honest score.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:clamp(30px,4vw,40px)\">\n        <sc-for list=\"{{ pillarChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"border:1px solid rgba(240,240,235,0.09);border-radius:14px;padding:16px 18px\">\n            <p style=\"margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8CC63F\">{{ c.n }}<\u002Fp>\n            <p style=\"margin:0;font-size:15px;font-weight:500;line-height:1.3\">{{ c.label }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ startCheck }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#7AB648;border:none;padding:13px 24px;border-radius:999px;color:#080B09;font-size:15px;font-weight:600;cursor:pointer;transition:.15s\" style-hover=\"background:#93D653\">Begin <span style=\"font-size:15px\">→<\u002Fspan><\u002Fbutton>\n      <p style=\"margin:18px 0 0;font-size:14px;color:rgba(240,240,235,0.62)\">No sign-up. No email required.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <div style=\"position:sticky;top:56px;z-index:40;background:rgba(8,11,9,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(240,240,235,0.07);padding:12px clamp(18px,4vw,40px)\">\n      <div style=\"max-width:720px;margin:0 auto\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8CC63F;white-space:nowrap\">{{ qPillar }}<\u002Fspan>\n          <div style=\"flex:1;height:3px;border-radius:2px;background:rgba(240,240,235,0.08)\"><div style=\"height:3px;border-radius:2px;background:#7AB648;transition:width .45s cubic-bezier(.2,.7,.2,1);width: {{ qProgress }}%\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(240,240,235,0.62);white-space:nowrap\">{{ qNum }}/18<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <section style=\"padding:clamp(40px,7vw,80px) clamp(18px,4vw,40px) clamp(70px,9vw,110px)\">\n      <div style=\"max-width:720px;margin:0 auto\">\n        <h2 style=\"font-size:clamp(25px,3.6vw,38px);font-weight:600;line-height:1.14;letter-spacing:-0.03em;margin:0 0 18px;animation:nwUp .4s cubic-bezier(.2,.7,.2,1) both\">{{ qText }}<\u002Fh2>\n\n        <button sc-camel-on-click=\"{{ toggleWhy }}\" style=\"display:inline-flex;align-items:center;gap:8px;background:none;border:none;padding:13px 0;margin:-13px 0 13px;color:rgba(240,240,235,0.62);font-size:14px;cursor:pointer;transition:.15s\" style-hover=\"color:#8CC63F\">{{ whyBtn }}<\u002Fbutton>\n        <sc-if value=\"{{ whyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:-14px 0 26px;padding:16px 0 0;border-top:1px solid rgba(240,240,235,0.1);max-width:600px;font-size:15px;line-height:1.6;color:rgba(240,240,235,0.6);animation:nwUp .3s ease both\">{{ qWhy }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ qOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"display:flex;align-items:center;gap:16px;text-align:left;border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .18s, background .18s, transform .18s;border:1px solid {{ opt.bd }};background: {{ opt.bg }};color:#F0F0EB\" style-hover=\"border-color:rgba(122,182,72,0.5);transform:translateX(3px)\">\n              <span style=\"width:26px;height:26px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid {{ opt.bd }};background: {{ opt.keyBg }};color: {{ opt.keyFg }}\">{{ opt.key }}<\u002Fspan>\n              <span style=\"font-size:16.5px;line-height:1.4;font-weight:400\">{{ opt.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px\">\n          <button sc-camel-on-click=\"{{ prevQ }}\" style=\"background:none;border:none;padding:13px 14px 13px 0;color:rgba(240,240,235,0.62);font-size:14.5px;cursor:pointer;transition:.15s\" style-hover=\"color:#F0F0EB\">← Back<\u002Fbutton>\n          <sc-if value=\"{{ qAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ nextQ }}\" style=\"background:#7AB648;border:none;padding:13px 26px;border-radius:999px;color:#080B09;font-size:15px;font-weight:600;cursor:pointer;transition:.15s\" style-hover=\"background:#93D653\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"padding:clamp(40px,5vw,64px) clamp(18px,4vw,40px) clamp(80px,10vw,120px)\">\n    <div style=\"max-width:1000px;margin:0 auto\">\n      <p style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F;margin:0 0 26px\">Your result<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(30px,5vw,56px);align-items:center;padding-bottom:clamp(34px,4vw,48px);border-bottom:1px solid rgba(240,240,235,0.08)\">\n        <div style=\"display:flex;align-items:center;gap:26px\">\n          <div style=\"width:132px;height:132px;flex-shrink:0;border-radius:50%;background:conic-gradient(#7AB648 0% {{ overall }}%, rgba(240,240,235,0.07) {{ overall }}% 100%);display:flex;align-items:center;justify-content:center\">\n            <div style=\"width:106px;height:106px;border-radius:50%;background:#080B09;display:flex;flex-direction:column;align-items:center;justify-content:center\">\n              <span style=\"font-size:40px;font-weight:600;letter-spacing:-0.03em;line-height:1\">{{ overall }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:rgba(240,240,235,0.62)\">OF 100<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 8px;font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-0.025em;line-height:1.15\">{{ band }}<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:rgba(240,240,235,0.55);max-width:300px\">{{ bandNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ areas }}\" as=\"area\" hint-placeholder-count=\"6\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;margin-bottom:6px\">\n                <span style=\"color:rgba(240,240,235,0.75)\">{{ area.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color: {{ area.fg }}\">{{ area.pct }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:6px;border-radius:3px;background:rgba(240,240,235,0.07)\"><div style=\"height:6px;border-radius:3px;background:linear-gradient(90deg,#5D8F35,#93D653);transition:width .8s cubic-bezier(.2,.7,.2,1);width: {{ area.pct }}%\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:clamp(34px,4vw,48px) 0\">\n        <h3 style=\"font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-0.03em;margin:0 0 6px\">Start here<\u002Fh3>\n        <p style=\"margin:0 0 26px;font-size:15.5px;color:rgba(240,240,235,0.5)\">{{ prioritiesLede }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n          <sc-for list=\"{{ priorities }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"background:#0F150F;border:1px solid rgba(240,240,235,0.08);border-radius:18px;padding:28px 26px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px\">\n                <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">{{ p.area }}<\u002Fp>\n                <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(240,240,235,0.62)\">{{ p.pct }}<\u002Fp>\n              <\u002Fdiv>\n              <h4 style=\"font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0 0 10px\">{{ p.title }}<\u002Fh4>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(240,240,235,0.55)\">{{ p.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding-bottom:clamp(34px,4vw,48px)\">\n        <h3 style=\"font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-0.03em;margin:0 0 clamp(26px,3vw,36px)\">What happens from here<\u002Fh3>\n        <div style=\"position:relative\">\n          <div style=\"position:absolute;left:0;right:0;top:9px;height:2px;background:linear-gradient(90deg,#7AB648,rgba(122,182,72,0.1))\"><\u002Fdiv>\n          <div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px\">\n            <sc-for list=\"{{ nextSteps }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"width:20px;height:20px;border-radius:50%;background:#080B09;border:2px solid #7AB648;display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#7AB648\"><\u002Fspan><\u002Fdiv>\n                <p style=\"margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">{{ n.step }}<\u002Fp>\n                <h4 style=\"font-size:17px;font-weight:600;letter-spacing:-0.02em;margin:0 0 6px;line-height:1.25\">{{ n.title }}<\u002Fh4>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:rgba(240,240,235,0.5)\">{{ n.body }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;overflow:hidden;background:#0F150F;border:1px solid rgba(122,182,72,0.3);border-radius:20px;padding:clamp(30px,4vw,46px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:26px\">\n        <span style=\"position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(122,182,72,0.14),transparent 70%);pointer-events:none\"><\u002Fspan>\n        <div style=\"position:relative;max-width:520px\">\n          <h3 style=\"font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-0.03em;line-height:1.14;margin:0 0 10px\">Talk it through with us.<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.55;color:rgba(240,240,235,0.6)\">Pick a time that suits you. Forty-five minutes on what's actually in the way, then an assessment built around what you tell us.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goBook }}\" style=\"position:relative;background:#7AB648;border:none;padding:17px 32px;border-radius:999px;color:#080B09;font-size:16.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s\" style-hover=\"background:#93D653\">Book a free discovery call <span style=\"font-size:14px;opacity:0.7\">↗<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px\">\n        <button sc-camel-on-click=\"{{ goReport }}\" style=\"background:none;border:1px solid rgba(240,240,235,0.2);padding:13px 24px;border-radius:999px;color:#F0F0EB;font-size:15px;cursor:pointer;transition:.15s\" style-hover=\"border-color:#7AB648;color:#8CC63F\">See your full report<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ restart }}\" style=\"background:none;border:none;color:rgba(240,240,235,0.38);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#F0F0EB\">Retake the check<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isReport }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"padding:clamp(20px,3vw,32px) clamp(14px,3vw,32px) clamp(60px,8vw,90px)\">\n\n    <div data-noprint=\"\" style=\"position:sticky;top:66px;z-index:40;max-width:1000px;margin:0 auto clamp(18px,2.5vw,26px);display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:rgba(8,11,9,0.86);backdrop-filter:blur(10px);border:1px solid rgba(240,240,235,0.08);border-radius:999px;padding:10px 12px\">\n      <button sc-camel-on-click=\"{{ goBook }}\" style=\"background:#7AB648;border:none;padding:12px 24px;border-radius:999px;color:#080B09;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s\" style-hover=\"background:#93D653\">Book a free discovery call <span style=\"font-size:13px;opacity:0.7\">↗<\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ savePdf }}\" style=\"background:none;border:1px solid rgba(240,240,235,0.18);padding:11px 20px;border-radius:999px;color:#F0F0EB;font-size:14.5px;white-space:nowrap;cursor:pointer;transition:.15s\" style-hover=\"border-color:#7AB648;color:#8CC63F\">{{ pdfLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goCheck }}\" style=\"background:none;border:none;padding:0 14px;color:rgba(240,240,235,0.62);font-size:14px;white-space:nowrap;cursor:pointer\" style-hover=\"color:#F0F0EB\">Back to results<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-report=\"\" style=\"max-width:1000px;margin:0 auto;background:#080B09;color:#F0F0EB;display:flex;flex-direction:column;gap:clamp(14px,2vw,18px)\">\n\n      <div data-keep=\"\" data-hero=\"\" style=\"position:relative;overflow:hidden;background:#0F150F;border:1px solid rgba(240,240,235,0.09);border-radius:24px;padding:clamp(26px,4vw,44px)\">\n        <span data-glow=\"\" style=\"position:absolute;inset:-120px -140px auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(122,182,72,0.13),transparent 68%);pointer-events:none\"><\u002Fspan>\n        <div style=\"position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:clamp(24px,4vw,44px)\">\n          <div style=\"flex:1 1 320px;min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:clamp(22px,3vw,34px)\">\n              <img src=\"25057141-c55d-485e-8c5a-c6b3d645daec\" alt=\"\" style=\"width:22px;height:22px;object-fit:contain\">\n              <span style=\"font-size:16px;font-weight:600;letter-spacing:-0.02em\">nwaila<span style=\"color:#7AB648\">.<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F\">Business health check<\u002Fp>\n            <h1 style=\"margin:0 0 14px;font-size:clamp(30px,4.6vw,46px);font-weight:600;letter-spacing:-0.04em;line-height:1.02;max-width:14em;text-wrap:balance\">{{ repHeadline }}<\u002Fh1>\n            <p data-lede=\"\" style=\"margin:0;font-size:17px;line-height:1.5;color:rgba(240,240,235,0.62);max-width:32em;text-wrap:pretty\">{{ bandNote }}<\u002Fp>\n          <\u002Fdiv>\n          <div data-ring=\"\" style=\"flex:0 0 auto;position:relative;width:180px;height:180px\">\n            <svg sc-camel-view-box=\"0 0 180 180\" width=\"180\" height=\"180\" style=\"display:block;transform:rotate(-90deg)\">\n              <circle cx=\"90\" cy=\"90\" r=\"76\" fill=\"none\" stroke=\"rgba(240,240,235,0.08)\" stroke-width=\"16\"><\u002Fcircle>\n              <circle cx=\"90\" cy=\"90\" r=\"76\" fill=\"none\" stroke=\"{{ ringColor }}\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-dasharray=\"{{ ringLen }}\" stroke-dashoffset=\"{{ ringOff }}\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px\">\n              <span data-score=\"\" style=\"font-size:58px;font-weight:600;letter-spacing:-0.05em;line-height:1;color:{{ ringColor }}\">{{ overall }}<\u002Fspan>\n              <span data-unit=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">out of 100<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;margin-top:clamp(24px,3vw,32px);padding-top:20px;border-top:1px solid rgba(240,240,235,0.08);display:flex;flex-wrap:wrap;gap:10px 26px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">\n          <span>{{ band }}<\u002Fspan>\n          <span>{{ repDate }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div data-keep=\"\" style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin:clamp(12px,2vw,20px) 4px 14px\">\n          <h2 style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,240,235,0.62);font-weight:400\">Where you stand<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#93D653\"><\u002Fspan>Holding<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#E0B341\"><\u002Fspan>Watch<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#E0705C\"><\u002Fspan>Act now<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-pillars=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(10px,1.5vw,14px)\">\n          <sc-for list=\"{{ repAreas }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div data-keep=\"\" data-pill=\"\" style=\"background:#0F150F;border:1px solid rgba(240,240,235,0.09);border-radius:18px;padding:20px\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px\">\n                <span data-name=\"\" style=\"font-size:15px;font-weight:500;letter-spacing:-0.015em;color:rgba(240,240,235,0.82);max-width:9em;text-wrap:pretty\">{{ a.name }}<\u002Fspan>\n                <span data-pct=\"\" style=\"font-size:32px;font-weight:600;letter-spacing:-0.04em;line-height:0.9;color:{{ a.fg }};white-space:nowrap\">{{ a.pct }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"display:block;height:6px;background:rgba(240,240,235,0.08);border-radius:4px;overflow:hidden;margin-bottom:12px\">\n                <span style=\"display:block;height:100%;width:{{ a.w }};background:{{ a.fg }};border-radius:4px\"><\u002Fspan>\n              <\u002Fspan>\n              <span data-verdict=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:{{ a.fg }}\">{{ a.verdict }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div data-keep=\"\" style=\"margin:clamp(14px,2vw,22px) 4px 16px\">\n          <h2 style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,240,235,0.62);font-weight:400\">{{ repFixHead }}<\u002Fh2>\n          <p style=\"margin:0;font-size:17px;line-height:1.5;color:rgba(240,240,235,0.72);max-width:34em;text-wrap:pretty\">{{ repFixLede }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:clamp(10px,1.5vw,14px)\">\n          <sc-for list=\"{{ repFixes }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div data-keep=\"\" data-fix=\"\" style=\"position:relative;background:#0F150F;border:1px solid rgba(240,240,235,0.09);border-radius:18px;padding:clamp(22px,3vw,30px)\">\n              <span style=\"position:absolute;top:20px;right:22px;width:9px;height:9px;border-radius:50%;background:{{ f.fg }};box-shadow:0 0 0 4px {{ f.bd }}\"><\u002Fspan>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;padding-right:26px\">\n                <span style=\"width:30px;height:30px;border-radius:9px;background:rgba(240,240,235,0.07);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:rgba(240,240,235,0.82)\">{{ f.n }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,240,235,0.62);white-space:nowrap\">{{ f.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:{{ f.fg }};background:{{ f.bd }};border-radius:7px;padding:5px 9px;white-space:nowrap\">Now {{ f.pct }}<\u002Fspan>\n                <sc-if value=\"{{ f.hasGain }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#93D653;background:rgba(122,182,72,0.16);border-radius:7px;padding:5px 9px;white-space:nowrap\">{{ f.gain }} overall<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <h3 style=\"margin:0 0 10px;font-size:clamp(22px,2.8vw,28px);font-weight:600;letter-spacing:-0.03em;line-height:1.12;max-width:20em;text-wrap:balance\">{{ f.title }}<\u002Fh3>\n              <p style=\"margin:0 0 16px;font-size:16.5px;line-height:1.6;color:rgba(240,240,235,0.72);max-width:38em;text-wrap:pretty\">{{ f.body }}<\u002Fp>\n              <p style=\"margin:0;padding-top:14px;border-top:1px solid rgba(240,240,235,0.08);font-size:15px;line-height:1.5;color:rgba(240,240,235,0.62)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">How we help &nbsp;<\u002Fspan>{{ f.help }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-keep=\"\" data-cta=\"\" style=\"position:relative;overflow:hidden;background:#101710;border:1px solid rgba(122,182,72,0.3);border-radius:24px;padding:clamp(26px,4vw,40px);margin-top:clamp(8px,1.5vw,14px)\">\n        <span style=\"position:absolute;inset:auto -100px -160px auto;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(122,182,72,0.14),transparent 70%);pointer-events:none\"><\u002Fspan>\n        <div style=\"position:relative\">\n          <p style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F\">What happens next<\u002Fp>\n          <h2 style=\"margin:0 0 26px;font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-0.035em;line-height:1.08;max-width:22em;text-wrap:balance\">You don't have to work through this list alone.<\u002Fh2>\n          <div data-steps=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:clamp(18px,3vw,30px);margin-bottom:30px\">\n            <div>\n              <p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">01 · The call<\u002Fp>\n              <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:rgba(240,240,235,0.75);text-wrap:pretty\">Forty-five minutes, no charge. You talk, we listen, and you bring whatever is actually in the way.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">02 · The assessment<\u002Fp>\n              <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:rgba(240,240,235,0.75);text-wrap:pretty\">We come back with an assessment built around what you told us, not a template.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8CC63F\">03 · The work<\u002Fp>\n              <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:rgba(240,240,235,0.75);text-wrap:pretty\">Then we do it with you - the management layer most small businesses never get to hire.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px\">\n            <button data-noprint=\"\" sc-camel-on-click=\"{{ goBook }}\" style=\"background:#7AB648;border:none;padding:16px 32px;border-radius:999px;color:#080B09;font-size:16.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s\" style-hover=\"background:#93D653\">Book a free discovery call <span style=\"font-size:14px;opacity:0.7\">↗<\u002Fspan><\u002Fbutton>\n            <p style=\"margin:0;font-size:15px;line-height:1.5;color:rgba(240,240,235,0.62);max-width:26em;text-wrap:pretty\">Your results come with the booking, so we can read them before we speak. Or email <a href=\"mailto:info@nwaila.co.za?subject=Business%20health%20check%20-%20my%20results\" style=\"color:#8CC63F\">info@nwaila.co.za<\u002Fa>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAppendix }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-break=\"\" style=\"background:#0F150F;border:1px solid rgba(240,240,235,0.09);border-radius:24px;padding:clamp(26px,4vw,40px);margin-top:clamp(8px,1.5vw,14px)\">\n        <p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#8CC63F\">Internal view · appendix<\u002Fp>\n        <h2 style=\"margin:0 0 30px;font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-0.03em\">Everything you told us<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:26px\">\n          <sc-for list=\"{{ repGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div data-keep=\"\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding-bottom:11px;margin-bottom:14px;border-bottom:1px solid rgba(240,240,235,0.1)\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:{{ g.fg }};flex:0 0 auto\"><\u002Fspan>\n                <span style=\"flex:1 1 auto;font-size:16.5px;font-weight:600;letter-spacing:-0.02em\">{{ g.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:{{ g.fg }}\">{{ g.pct }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ g.qs }}\" as=\"q\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 24px\">\n                    <span style=\"font-size:14.5px;line-height:1.5;color:rgba(240,240,235,0.62);text-wrap:pretty\">{{ q.t }}<\u002Fspan>\n                    <span style=\"font-size:14.5px;line-height:1.5;color:#F0F0EB;font-weight:500;text-wrap:pretty\">{{ q.a }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div data-keep=\"\" data-colophon=\"\" style=\"border-top:1px solid rgba(240,240,235,0.09);padding:28px 4px 0;margin-top:clamp(8px,1.5vw,14px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px\">\n        <div>\n          <p style=\"margin:0 0 9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">Prepared by<\u002Fp>\n          <p style=\"margin:0;font-size:15px;font-weight:600;letter-spacing:-0.015em\">Nwaila Investments<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">Where to find us<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(240,240,235,0.72)\">Corner Main Road &amp; Sloane Street<br>Bryanston, Johannesburg, 2021<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">Get in touch<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(240,240,235,0.72)\">info@nwaila.co.za<br>nwaila.co.za<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,240,235,0.62)\">About this report<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(240,240,235,0.62)\">Self-assessed and indicative. Not an audit.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ askConsent }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;justify-content:center;padding:clamp(12px,2vw,22px);pointer-events:none;animation:nwUp .5s cubic-bezier(.2,.7,.2,1) both\">\n    <div style=\"pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(14px,2vw,26px);max-width:820px;width:100%;background:#101710;border:1px solid rgba(122,182,72,0.28);border-radius:16px;padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,0.6)\">\n      <p style=\"margin:0;flex:1 1 300px;min-width:0;font-size:14.5px;line-height:1.5;color:rgba(240,240,235,0.7)\">We measure how this site is used, including health check answers. Accept for full measurement, or decline and we count your visit without storing anything on your device. <a href=\"privacy.html\" style=\"color:#8CC63F\">Read the notice<\u002Fa>.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex:0 0 auto\">\n        <button sc-camel-on-click=\"{{ declineCookies }}\" style=\"background:none;border:1px solid rgba(240,240,235,0.18);padding:11px 18px;border-radius:999px;color:rgba(240,240,235,0.75);font-size:14.5px;white-space:nowrap;cursor:pointer;transition:.15s\" style-hover=\"border-color:rgba(240,240,235,0.62);color:#F0F0EB\">No thanks<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ acceptCookies }}\" style=\"background:#7AB648;border:none;padding:11px 22px;border-radius:999px;color:#080B09;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s\" style-hover=\"background:#93D653\">Accept<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer data-noprint=\"\" style=\"border-top:1px solid rgba(240,240,235,0.07);padding:clamp(36px,5vw,52px) clamp(18px,4vw,40px) 40px\">\n    <div style=\"max-width:1300px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n          <img src=\"25057141-c55d-485e-8c5a-c6b3d645daec\" alt=\"\" style=\"width:25px;height:25px;object-fit:contain\">\n          <span style=\"font-size:18px;font-weight:600;letter-spacing:-0.02em\">nwaila<span style=\"color:#7AB648\">.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 4px;font-size:14px;color:rgba(240,240,235,0.62)\">Corner Main Rd &amp; Sloane Street, Bryanston, 2021<\u002Fp>\n        <p style=\"margin:0;font-size:14px\"><a href=\"mailto:info@nwaila.co.za\" style=\"display:inline-block;padding:12px 0\" style-hover=\"color:#A9DB63\">info@nwaila.co.za<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:2px 28px;font-size:14px;color:rgba(240,240,235,0.62)\">\n        <button sc-camel-on-click=\"{{ goSme }}\" style=\"background:none;border:none;padding:13px 0;color:inherit;font-size:14px;line-height:1.2;cursor:pointer\" style-hover=\"color:#8CC63F\">SMEs<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goEnt }}\" style=\"background:none;border:none;padding:13px 0;color:inherit;font-size:14px;line-height:1.2;cursor:pointer\" style-hover=\"color:#8CC63F\">Enterprises<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goDemos }}\" style=\"background:none;border:none;padding:13px 0;color:inherit;font-size:14px;line-height:1.2;cursor:pointer\" style-hover=\"color:#8CC63F\">Platform<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAbout }}\" style=\"background:none;border:none;padding:13px 0;color:inherit;font-size:14px;line-height:1.2;cursor:pointer\" style-hover=\"color:#8CC63F\">About<\u002Fbutton>\n        <a href=\"mailto:info@nwaila.co.za?subject=Nwaila%20Investments%20-%20enquiry&amp;body=Hello%20Nwaila%2C%0A%0A\" style=\"padding:13px 0;color:inherit;font-size:14px;line-height:1.2\" style-hover=\"color:#8CC63F\">Email us<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(240,240,235,0.55)\">© 2026 Nwaila Investments<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;tourSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:3,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst PILLARS = [\n  { label: \"Compliance & legal\",\n    fix: { title: \"Get the file in order\", body: \"CIPC brought current, a live tax compliance status, a B-BBEE affidavit in hand. These are the checks that quietly disqualify you from work you never hear about.\" },\n    qs: [\n      { t: \"Is your company registered with CIPC, with annual returns filed?\",\n        w: \"Two years of missed annual returns starts deregistration, and a deregistered company cannot legally trade. It stays invisible until a tender asks for a certificate of good standing.\",\n        o: [ {p:5,m:\"Yes, all returns filed and records current\"}, {p:3,m:\"Registered, about a year behind\"}, {p:1,m:\"More than two years outstanding\"}, {p:0,m:\"Not registered - we trade informally\"} ] },\n      { t: \"Do you have a valid SARS Tax Compliance Status pin right now?\",\n        w: \"Without a live TCS pin you cannot bid on government tenders, access most development finance, or contract with many large corporates. It expires every twelve months.\",\n        o: [ {p:5,m:\"Yes, valid and within expiry\"}, {p:3,m:\"We had one, it has expired\"}, {p:1,m:\"Registered with SARS, never had a pin\"}, {p:0,m:\"Returns outstanding, or not registered\"} ] },\n      { t: \"Is your B-BBEE certificate or sworn affidavit current?\",\n        w: \"Under R10 million turnover you only need a sworn affidavit. It costs nothing and takes an afternoon. Expired, it costs you procurement every day.\",\n        o: [ {p:5,m:\"Yes, issued within the last year\"}, {p:3,m:\"Expired, or expiring within two months\"}, {p:1,m:\"We've never had one\"}, {p:0,m:\"We know we need one, not how to get it\"} ] }\n    ] },\n  { label: \"Financial management\",\n    fix: { title: \"A cash view you can act on\", body: \"Monthly accounts inside fifteen days, margin by line, and a rolling thirteen-week cash forecast. We build them with you, then hand over the routine.\" },\n    qs: [\n      { t: \"How often are your management accounts produced?\",\n        w: \"A tax return tells SARS what happened last year. Management accounts tell you what is happening now.\",\n        o: [ {p:6,m:\"Monthly, within fifteen days of month-end\"}, {p:4,m:\"Quarterly\"}, {p:2,m:\"Annually, with the tax return\"}, {p:0,m:\"We don't produce them\"} ] },\n      { t: \"Could you tell us this month's gross margin right now?\",\n        w: \"Gross margin is revenue less direct delivery cost. It says whether the core business is profitable before overheads - and most pricing decisions depend on it.\",\n        o: [ {p:6,m:\"The exact figure, I review it monthly\"}, {p:4,m:\"Within about five points\"}, {p:2,m:\"A rough idea, never calculated\"}, {p:0,m:\"We don't track it\"} ] },\n      { t: \"Do you keep a rolling cash flow forecast?\",\n        w: \"Revenue is not cash. A forecast shows a squeeze before it arrives rather than after.\",\n        o: [ {p:5,m:\"Thirteen weeks, updated weekly\"}, {p:3,m:\"A monthly projection\"}, {p:1,m:\"We watch the bank balance\"}, {p:0,m:\"We don't forecast cash\"} ] }\n    ] },\n  { label: \"Tax efficiency\",\n    fix: { title: \"Stop overpaying\", body: \"A practitioner through the year rather than at year-end, employment tax incentives claimed monthly, and provisional tax set aside as it accrues.\" },\n    qs: [\n      { t: \"Do you work with a tax practitioner through the year?\",\n        w: \"A year-end accountant manages compliance. An ongoing practitioner manages structure, incentives and provisional tax so there is no surprise bill.\",\n        o: [ {p:5,m:\"Yes, at least quarterly\"}, {p:3,m:\"Only at year-end\"}, {p:1,m:\"I handle it, consulting occasionally\"}, {p:0,m:\"We don't use one\"} ] },\n      { t: \"Are you claiming the Employment Tax Incentive for eligible staff?\",\n        w: \"ETI is a direct credit against monthly PAYE, not a deduction. Employees aged 18 to 29 earning R2,000 to R6,500 a month qualify.\",\n        o: [ {p:5,m:\"Yes, claimed monthly\"}, {p:3,m:\"We know about it, haven't implemented\"}, {p:1,m:\"I wasn't aware of it\"}, {p:0,m:\"No staff in that range\"} ] },\n      { t: \"How do you manage provisional tax?\",\n        w: \"The second payment must cover at least 90% of actual liability or SARS penalises the shortfall. Setting aside monthly avoids the problem entirely.\",\n        o: [ {p:5,m:\"A dedicated account, both payments on time\"}, {p:3,m:\"We pay, but finding the cash is a scramble\"}, {p:1,m:\"We've missed or underpaid before\"}, {p:0,m:\"I'm not sure how it works for us\"} ] }\n    ] },\n  { label: \"People & HR\",\n    fix: { title: \"Close the CCMA exposure\", body: \"Written signed contracts, an acknowledged disciplinary policy, leave tracked properly. Unglamorous, quick, and the difference between defending a decision and settling it.\" },\n    qs: [\n      { t: \"Is everyone on a written, signed employment contract?\",\n        w: \"A verbal agreement is worth little at the CCMA. Without a contract the employee's version stands and BCEA minimums apply.\",\n        o: [ {p:5,m:\"Yes, everyone\"}, {p:3,m:\"Most - one or two verbal\"}, {p:1,m:\"Some do, most don't\"}, {p:0,m:\"Nobody does, or I have no staff\"} ] },\n      { t: \"Have employees signed for a disciplinary policy and code of conduct?\",\n        w: \"Procedural fairness means the employee knew the rules in advance. Without a signed acknowledgement you cannot prove it.\",\n        o: [ {p:5,m:\"Yes, written and signed by all\"}, {p:3,m:\"It exists, nobody signed\"}, {p:1,m:\"Managed informally, nothing written\"}, {p:0,m:\"No framework at all\"} ] },\n      { t: \"Do you formally track annual, sick and family leave?\",\n        w: \"If you don't track it, an employee can claim any figure and disproving it falls to you.\",\n        o: [ {p:5,m:\"A formal system, kept current\"}, {p:3,m:\"A spreadsheet or notebook\"}, {p:1,m:\"Staff track their own\"}, {p:0,m:\"We don't track leave\"} ] }\n    ] },\n  { label: \"Funding readiness\",\n    fix: { title: \"Make the business fundable\", body: \"Reviewed financials for two years, a plan a credit committee can read, and a deliberate answer on client concentration before an analyst raises it.\" },\n    qs: [\n      { t: \"Do you have reviewed or audited financials for the last two years?\",\n        w: \"Compilations are not accepted by most banks or development finance institutions. Without a review, no funder can verify your numbers.\",\n        o: [ {p:6,m:\"Audited, both years\"}, {p:4,m:\"Independently reviewed, both years\"}, {p:2,m:\"Compilations only\"}, {p:0,m:\"No formal statements\"} ] },\n      { t: \"Do you have a written plan with three-year projections?\",\n        w: \"A funding plan is a financial argument: what the money does, what it returns, how it gets repaid. Most rejections are about the projections.\",\n        o: [ {p:5,m:\"Yes, with assumptions, updated recently\"}, {p:3,m:\"A plan, but projections are old\"}, {p:1,m:\"Something brief, not funder standard\"}, {p:0,m:\"No written plan\"} ] },\n      { t: \"Is any single client more than 30% of revenue?\",\n        w: \"Concentration is the first thing a credit analyst checks, because the question is what happens to repayment if that client leaves.\",\n        o: [ {p:5,m:\"No client above 30%\"}, {p:3,m:\"One between 30% and 50%\"}, {p:1,m:\"One above half\"}, {p:0,m:\"One above 70%\"} ] }\n    ] },\n  { label: \"Growth & strategy\",\n    fix: { title: \"Build something that runs without you\", body: \"A written plan the team has seen, a pipeline tracked somewhere other than memory, and the processes carrying your revenue written down with owners against them.\" },\n    qs: [\n      { t: \"Do you have a written strategy your team has seen?\",\n        w: \"A strategy in the owner's head is hostage to the owner being present, and it is among the first things a funder asks to see.\",\n        o: [ {p:5,m:\"Written, shared, reviewed annually\"}, {p:3,m:\"In my head, communicated verbally\"}, {p:1,m:\"A rough plan, not written down\"}, {p:0,m:\"No formal plan\"} ] },\n      { t: \"How do you track your sales pipeline?\",\n        w: \"A pipeline record shows every prospect, where they are, and why deals were won or lost. Tracked, businesses close noticeably more.\",\n        o: [ {p:5,m:\"A CRM, actively maintained\"}, {p:3,m:\"A spreadsheet, kept current\"}, {p:1,m:\"Message and email history\"}, {p:0,m:\"Memory\"} ] },\n      { t: \"Could someone else follow your core processes?\",\n        w: \"If you are the only one who can quote a job or handle a complaint, you own the shares but you work the job.\",\n        o: [ {p:5,m:\"Yes, written and followed independently\"}, {p:3,m:\"Some documented, most depend on me\"}, {p:1,m:\"Nothing documented\"}, {p:0,m:\"Haven't considered it\"} ] }\n    ] }\n];\n\nPILLARS.forEach(p => { p.max = p.qs.reduce((a, q) => a + Math.max.apply(null, q.o.map(o => o.p)), 0); });\n\n// ── Where the discovery call is booked ───────────────────────────\nconst CALENDLY_URL = \"https://calendly.com/nwaila-advisory/business-health-check\";\n\n\n\n// When a pillar is already at a working standard, the fix copy above would be\n// wrong - a well-run business must not be told to get its file in order.\nconst KEEP = [\n  { title: \"Keep the file current\", body: \"Nothing here is broken. The risk is drift: a lapsed filing or an expired certificate that only surfaces when someone asks for it.\" },\n  { title: \"Push the numbers further\", body: \"The reporting works. The next gain is using it to price better and to plan capacity, rather than only to look back.\" },\n  { title: \"Review the structure\", body: \"Compliant and current. Worth testing whether the structure still suits the size the business has grown to.\" },\n  { title: \"Keep the paperwork alive\", body: \"Contracts and policies are in place. They need reviewing as roles change, or they stop protecting you.\" },\n  { title: \"Stay funder-ready\", body: \"You could raise if you needed to. Keeping it that way is cheaper than rebuilding the pack under pressure.\" },\n  { title: \"Test the plan against reality\", body: \"There is a plan and it is being followed. The question now is whether it is still the right one.\" }\n];\n\nconst PILLAR_KEYS = [\"compliance\", \"finance\", \"tax\", \"people\", \"funding\", \"growth\"];\n\nconst FLAT = [];\nPILLARS.forEach((p, pi) => p.qs.forEach((q, qi) => FLAT.push({ pi: pi, qi: qi, q: q, pillar: p.label })));\n\nconst TOUR = [\n  { n: \"01\", label: \"Link the bank\", panel: \"bank\", hint: \"\", caption: \"The bank accounts connect once. Every balance and movement lands here, categorised, with no spreadsheet in between.\" },\n  { n: \"02\", label: \"Run the week\", panel: \"day\", hint: \"Try it: chase the unpaid invoices\", caption: \"Quotes, invoices, jobs and collections in one place - running the business, not just reporting on it.\" },\n  { n: \"03\", label: \"Early warning\", panel: \"ai\", hint: \"Try it: open an alert\", caption: \"The platform reads the numbers every week and tells the owner what is coming, while there is still time to act.\" },\n  { n: \"04\", label: \"Readiness\", panel: \"fund\", hint: \"Try it: tick the missing document\", caption: \"Behaviour becomes a readiness score, pre-qualified against your credit policy before anyone applies.\" },\n  { n: \"05\", label: \"Why own it\", panel: \"all\", hint: \"White-label or build with us\", caption: \"Run this platform under your own brand and the SME relationship stops being a once-a-year credit decision.\" }\n];\n\nclass Component extends DCLogic {\n  state = { route: \"home\", qIndex: 0, answers: {}, done: false, sent: false, askConsent: false, why: false, tour: 0, playing: true, chased: false, openAlert: -1, docDone: false };\n\n  componentDidMount() {\n    if (typeof window !== \"undefined\") {\n      const m = window.location.search.match(/[?&]r=([0-9x]+)/i);\n      if (m && m[1].length === FLAT.length) {\n        const answers = {};\n        FLAT.forEach((it, i) => { const c = m[1][i]; if (c !== \"x\") answers[it.pi + \":\" + it.qi] = parseInt(c, 10); });\n        this.setState({ answers: answers, done: true, route: \"report\" });\n      }\n    }\n    if (typeof window !== \"undefined\" && typeof window.nwConsentState === \"function\" && !window.nwConsentState()) {\n      setTimeout(() => this.setState({ askConsent: true }), 900);\n    }\n    this.observe(); this.startTour(); this.sizeTour(); this.watchScroll();\n    if (typeof window !== \"undefined\") {\n      // Every mailto on the site, without hanging a handler on each one.\n      document.addEventListener(\"click\", (e) => {\n        const a = e.target && e.target.closest ? e.target.closest('a[href^=\"mailto:\"]') : null;\n        if (a) this.track(\"email_click\", { where: this.state.route });\n      });\n    }\n    if (typeof window !== \"undefined\") {\n      this.onResize = () => this.sizeTour();\n      window.addEventListener(\"resize\", this.onResize);\n    }\n  }\n\n  // A real file download rather than the browser print sheet. The library is\n  // fetched on demand so it never weighs on page load; if it cannot load we\n  // fall back to print, which is the only other way to reach a PDF.\n  async savePdf(overall) {\n    if (typeof window === \"undefined\" || this.state.pdfBusy) return;\n    this.track(\"report_pdf\", { overall_score: overall, journey: this.entryPath || \"direct\" });\n    this.setState({ pdfBusy: true });\n    const shell = document.querySelector(\"[data-shell]\");\n    const node = document.querySelector(\"[data-report]\");\n    try {\n      const load = (src, ready) => ready() ? Promise.resolve() : new Promise((res, rej) => {\n        const sc = document.createElement(\"script\");\n        sc.src = src; sc.onload = res; sc.onerror = rej;\n        document.head.appendChild(sc);\n      });\n      await load(\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\", () => !!window.html2canvas);\n      await load(\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\", () => !!(window.jspdf && window.jspdf.jsPDF));\n\n      if (shell) shell.setAttribute(\"data-pdf\", \"\");\n      await new Promise(r => setTimeout(r, 180));\n\n      // Each block is captured on its own and then placed on a page, so a page\n      // break can only ever fall between blocks - never through a card or a\n      // line of type. Pages run as long as the report needs.\n      const blocks = [];\n      Array.prototype.forEach.call(node.children, child => {\n        if (child.matches(\"[data-hero],[data-cta],[data-colophon]\")) { blocks.push(child); return; }\n        // The appendix holds its own heading plus six answer groups a level\n        // down, so those are collected too - otherwise it arrives as one\n        // block taller than a page.\n        const parts = child.querySelectorAll(\":scope > p, :scope > h2, :scope > [data-keep], :scope > [data-pillars], :scope > div > [data-fix], :scope > div > [data-keep]:not([data-pill])\");\n        if (parts.length) Array.prototype.forEach.call(parts, p => blocks.push(p));\n        else blocks.push(child);\n      });\n\n      const scale = 2;\n      const cssW = node.offsetWidth;\n      const shots = [];\n      for (const el of blocks) {\n        const c = await window.html2canvas(el, {\n          scale: scale, backgroundColor: \"#080B09\", useCORS: true, logging: false,\n          width: el.offsetWidth, windowWidth: cssW\n        });\n        shots.push({\n          canvas: c, url: c.toDataURL(\"image/jpeg\", 0.95),\n          w: c.width / scale, h: c.height / scale\n        });\n      }\n      if (shell) shell.removeAttribute(\"data-pdf\");\n\n      const jsPDF = window.jspdf.jsPDF;\n      const pdf = new jsPDF({ unit: \"mm\", format: \"a4\", orientation: \"portrait\" });\n      const mL = 11, mT = 12;\n      const pageW = 210 - mL * 2, pageH = 297 - mT * 2;\n      const mmPerPx = pageW / cssW;\n      const gap = 3.2;\n      const newPage = () => { pdf.setFillColor(8, 11, 9); pdf.rect(0, 0, 210, 297, \"F\"); };\n      newPage();\n      let y = 0;\n      shots.forEach((s, i) => {\n        const w = s.w * mmPerPx, h = s.h * mmPerPx;\n        const next = shots[i + 1];\n        // A section heading travels with the block under it rather than being\n        // left stranded at the foot of a page.\n        const isHeading = s.h < 90;\n        const need = isHeading && next ? h + gap + Math.min(next.h * mmPerPx, pageH) : h;\n        if (y > 0 && y + need > pageH + 0.5) { pdf.addPage(); newPage(); y = 0; }\n        const x = mL + (cssW - s.w) * mmPerPx / 2;\n        if (h <= pageH + 0.5) {\n          pdf.addImage(s.url, \"JPEG\", x, mT + y, w, h);\n          y += h + gap;\n          return;\n        }\n        // Taller than a whole sheet: slice it rather than let the overflow\n        // fall off the page and vanish.\n        let cut = 0;\n        while (cut < s.h - 1) {\n          const takeMm = Math.min(pageH - y, h - cut * mmPerPx);\n          const takePx = Math.round(takeMm / mmPerPx * scale);\n          const part = document.createElement(\"canvas\");\n          part.width = s.canvas.width;\n          part.height = takePx;\n          const px = part.getContext(\"2d\");\n          px.fillStyle = \"#080B09\";\n          px.fillRect(0, 0, part.width, part.height);\n          px.drawImage(s.canvas, 0, Math.round(cut * scale), s.canvas.width, takePx, 0, 0, part.width, takePx);\n          pdf.addImage(part.toDataURL(\"image/jpeg\", 0.95), \"JPEG\", x, mT + y, w, takeMm);\n          cut += takeMm / mmPerPx;\n          if (cut < s.h - 1) { pdf.addPage(); newPage(); y = 0; } else { y += takeMm + gap; }\n        }\n      });\n      pdf.save(\"nwaila-business-health-check.pdf\");\n    } catch (e) {\n      window.print();\n    } finally {\n      if (shell) shell.removeAttribute(\"data-pdf\");\n      this.setState({ pdfBusy: false });\n    }\n  }\n\n  // The appendix is for Nwaila, not the client. Same link, plus &full=1.\n  internalLink() {\n    return this.reportLink() + \"&full=1\";\n  }\n\n  // Options are authored best-first, which meant answering \"A\" all the way\n  // down scored full marks. The display order is shuffled per question with a\n  // fixed seed, so it never changes under the user mid-check and the stored\n  // answer is still the real option index (report links stay valid).\n  optOrder(pi, qi, n) {\n    const idx = Array.from({ length: n }, (_, i) => i);\n    let seed = (pi + 1) * 7349 + (qi + 1) * 911;\n    for (let i = n - 1; i > 0; i--) {\n      seed = (seed * 1103515245 + 12345) & 0x7fffffff;\n      const j = seed % (i + 1);\n      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;\n    }\n    return idx;\n  }\n\n  answerCode() {\n    return FLAT.map(it => { const oi = this.state.answers[it.pi + \":\" + it.qi]; return oi === undefined ? \"x\" : String(oi); }).join(\"\");\n  }\n\n  reportLink() {\n    if (typeof window === \"undefined\") return \"\";\n    return window.location.origin + window.location.pathname + \"?r=\" + this.answerCode();\n  }\n\n  componentDidUpdate() {\n    this.observe();\n    this.sizeTour();\n    const key = this.state.route + \":\" + this.state.playing + \":\" + (this.props.tourSeconds || 5);\n    if (this.tourKey !== key) { this.tourKey = key; this.startTour(); }\n  }\n\n  componentWillUnmount() {\n    if (this.timer) clearInterval(this.timer);\n    if (this.fallback) clearTimeout(this.fallback);\n    if (this.io) this.io.disconnect();\n  }\n\n  // Picking a step by hand brings that panel up under the header, so the panel\n  // you asked for fills the screen. Autoplay never scrolls.\n  // A flex row takes the height of its tallest child, so the wrapper has to be\n  // driven from the visible slide or every short panel trails dead space.\n  sizeTour() {\n    const wrap = this.trackEl;\n    if (typeof window === \"undefined\" || !wrap) return;\n    const apply = () => {\n      if (!this.trackEl) return;\n      const slides = this.trackEl.querySelectorAll(\"[data-slide]\");\n      const active = slides[this.state.tour];\n      if (active) this.trackEl.style.height = active.offsetHeight + \"px\";\n    };\n    requestAnimationFrame(apply);\n    clearTimeout(this.sizeT);\n    this.sizeT = setTimeout(apply, 320);\n  }\n\n  focusTour() {\n    if (typeof window === \"undefined\" || !this.trackEl) return;\n    requestAnimationFrame(() => {\n      if (!this.trackEl) return;\n      const top = this.trackEl.getBoundingClientRect().top + window.pageYOffset - 96;\n      window.scrollTo({ top: Math.max(0, top), behavior: \"smooth\" });\n    });\n  }\n\n  stepBy(d) {\n    if (this.timer) clearInterval(this.timer);\n    this.setState(st => {\n      const next = (st.tour + d + TOUR.length) % TOUR.length;\n      this.trackTour(next, \"click\");\n      return { tour: next, playing: false };\n    });\n    this.focusTour();\n  }\n\n  // Which tour steps get seen, and whether the visitor drove or watched.\n  trackTour(i, how) {\n    const key = i + \":\" + how;\n    this.tourSeen = this.tourSeen || {};\n    if (this.tourSeen[key]) return;\n    this.tourSeen[key] = true;\n    this.track(\"tour_step\", { step: TOUR[i].n, label: TOUR[i].label, source: how });\n  }\n\n  startTour() {\n    if (typeof window === \"undefined\") return;\n    if (this.timer) clearInterval(this.timer);\n    const secs = this.props.tourSeconds || 5;\n    this.tourKey = this.state.route + \":\" + this.state.playing + \":\" + secs;\n    if (this.state.route !== \"demos\" || !this.state.playing) return;\n    this.timer = setInterval(() => {\n      this.setState(st => {\n        const next = (st.tour + 1) % TOUR.length;\n        this.trackTour(next, \"autoplay\");\n        return { tour: next };\n      });\n    }, secs * 1000);\n  }\n\n  observe() {\n    if (typeof window === \"undefined\") return;\n    const reveal = (el) => { el.style.opacity = \"1\"; el.style.transform = \"none\"; };\n    const wide = (el) => { el.style.transform = \"scaleX(1)\"; };\n    const run = () => {\n      const nodes = Array.prototype.slice.call(document.querySelectorAll(\"[data-reveal],[data-reveal-wide]\"))\n        .filter(n => !n.hasAttribute(\"data-revealed\"));\n      if (!nodes.length) return;\n      const show = (n) => { n.setAttribute(\"data-revealed\", \"\"); n.hasAttribute(\"data-reveal-wide\") ? wide(n) : reveal(n); };\n      if (this.props.motion === false || !(\"IntersectionObserver\" in window)) { nodes.forEach(show); return; }\n      if (this.io) this.io.disconnect();\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach(e => { if (e.isIntersecting) { show(e.target); this.io.unobserve(e.target); } });\n      }, { rootMargin: \"0px 0px -6% 0px\", threshold: 0.02 });\n      nodes.forEach(n => {\n        const r = n.getBoundingClientRect();\n        if (r.top < window.innerHeight * 1.1) show(n);\n        else this.io.observe(n);\n      });\n      if (this.fallback) clearTimeout(this.fallback);\n      this.fallback = setTimeout(() => nodes.forEach(show), 2200);\n    };\n    // rAF alone never fires while the document is hidden (bundled/offscreen\n    // loads), which would leave everything at opacity 0 - so schedule both ways.\n    requestAnimationFrame(() => requestAnimationFrame(run));\n    setTimeout(run, 80);\n    setTimeout(run, 600);\n    if (!this.visHooked) {\n      this.visHooked = true;\n      document.addEventListener(\"visibilitychange\", () => { if (!document.hidden) run(); });\n      window.addEventListener(\"load\", run);\n    }\n  }\n\n  // Anonymous only: the six scores and the total, no identifying data of any kind.\n  // Aggregates in Google Analytics; nothing is stored by this site.\n  trackCompletion() {\n    const s = this.state, p = {};\n    let sum = 0, max = 0;\n    PILLARS.forEach((pl, k) => {\n      let ps = 0;\n      pl.qs.forEach((q, qi) => { const oi = s.answers[k + \":\" + qi]; if (oi !== undefined) ps += q.o[oi].p; });\n      sum += ps; max += pl.max;\n      p[\"score_\" + PILLAR_KEYS[k]] = Math.round((ps / pl.max) * 100);\n    });\n    p.overall_score = max ? Math.round((sum / max) * 100) : 0;\n    p.score_band = p.overall_score >= 70 ? \"70-100\" : p.overall_score >= 40 ? \"40-69\" : \"0-39\";\n    p.weakest = PILLAR_KEYS[PILLARS.map((pl, k) => this.pillarScore(k)).reduce((lo, v, i, arr) => (v < arr[lo] ? i : lo), 0)];\n    p.answers_code = this.answerCode();\n    // A clickable link straight from the GA4 report to that person's report.\n    // Pinned to the live domain so it works from anywhere.\n    p.report_link = \"https://nwaila.co.za/?r=\" + p.answers_code + \"&full=1\";\n    p.journey = this.entryPath || \"direct\";\n    this.track(\"health_check_complete\", p);\n    this.clearIdle();\n  }\n\n  // A check left half-finished reports in after two minutes of nothing,\n  // carrying how far they got and what they had answered.\n  armIdle() {\n    if (typeof window === \"undefined\") return;\n    this.clearIdle();\n    this.idleT = setTimeout(() => {\n      const s = this.state;\n      if (s.done || s.route !== \"quiz\") return;\n      const answered = Object.keys(s.answers).length;\n      if (!answered) return;\n      this.track(\"health_check_abandoned\", {\n        answered: answered,\n        stopped_at: s.qIndex + 1,\n        stopped_pillar: PILLAR_KEYS[FLAT[s.qIndex].pi],\n        answers_code: this.answerCode(),\n        report_link: \"https://nwaila.co.za/?r=\" + this.answerCode() + \"&full=1\",\n        journey: this.entryPath || \"direct\"\n      });\n      this.idleSent = true;\n    }, 120000);\n  }\n\n  clearIdle() {\n    if (this.idleT) { clearTimeout(this.idleT); this.idleT = null; }\n  }\n\n  track(name, params) {\n    if (typeof window !== \"undefined\" && typeof window.nwTrack === \"function\") window.nwTrack(name, params || {});\n  }\n\n  go(route) {\n    // Which fork someone came through, carried on every later event so a\n    // booking can be attributed to the SME or the enterprise path.\n    if (route === \"sme\" || route === \
